# Databricks Asset Bundle — vector-blf-ingestion
#
# Automates:
#   1. maturin build  →  Linux wheel (vector_blf-*.whl)
#   2. Upload wheel + DLT notebook to Databricks workspace
#   3. Create / update the DLT pipeline resource
#
# Prerequisites
# -------------
#   databricks CLI ≥ 0.205  (brew install databricks  /  pip install databricks-cli)
#   databricks configure     (sets host + token in ~/.databrickscfg)
#
# Cross-compilation note (Windows / macOS)
# ----------------------------------------
# Databricks clusters run Linux, so the wheel must target manylinux.
# maturin handles this automatically with --manylinux auto IF Docker Desktop
# is running.  Alternative (no Docker):
#   cargo install cargo-zigbuild
#   rustup target add x86_64-unknown-linux-gnu
#   maturin build --release --features python \
#       --target x86_64-unknown-linux-gnu --zig
#
# Workflow
# --------
#   databricks bundle validate          # check YAML + resolve substitutions
#   databricks bundle deploy            # build wheel, upload, deploy (dev)
#   databricks bundle deploy -t prod    # deploy to production
#   databricks bundle run blf_ingestion # trigger a pipeline run
#   databricks bundle destroy           # tear down all managed resources

bundle:
  name: vector-blf-ingestion

# Pull in per-resource definitions co-located with their source folders.
include:
  - databricks/blf-pipeline/blf_ingestion.pipeline.yml
  - databricks/signal-docs-pipeline/signal_docs.pipeline.yml
  - databricks/scene-pipeline/blf_scenes.pipeline.yml
  - databricks/signal-viewer/signal_viewer.app.yml
  - databricks/signal-importer/signal_importer.job.yml

# ── artifact: maturin wheel ───────────────────────────────────────────────────

artifacts:
  vector_blf:
    type: whl
    # Runs locally before upload; produces target/wheels/vector_blf-*.whl
    build: bash databricks/blf-pipeline/build_wheel.sh
    path: .  # build runs from here; DABs scans recursively for *.whl (finds dist/)

# ── shared variables (overridable per target) ─────────────────────────────────

variables:
  target_catalog:
    description: Unity Catalog catalog for output Delta tables.
    default: main

  target_schema:
    description: Unity Catalog schema (database) for output Delta tables.
    default: blf

  blf_source_path:
    description: >
      Unity Catalog Volume path that contains the *.blf source files.
      Auto Loader monitors this directory for new files.
    default: /Volumes/${var.target_catalog}/${var.target_schema}/raw

  video_path:
    description: >
      Unity Catalog Volume path that contains video files (e.g. dashcam
      footage) recorded alongside the *.blf source files. Auto Loader
      monitors this directory; each *.mp4/*.webm/*.mov file becomes a row in
      blf_video_files, keyed by filename stem. Signal Viewer plays back a
      video alongside a BLF file's signal timeline when they share the same
      stem, e.g. drive001.blf <-> drive001.mp4. Leave empty to disable video
      ingestion entirely.
    default: /Volumes/${var.target_catalog}/${var.target_schema}/video

  signals_path:
    description: >
      Unity Catalog Volume path to the signal definitions CSV.
      If empty, blf_silver_can_signals will be empty.
      Format: message_id,signal_name,start_bit,bit_length,byte_order,is_signed,scale,offset
    default: /Volumes/${var.target_catalog}/${var.target_schema}/signals/can_signals.csv

  someip_signals_path:
    description: >
      Unity Catalog Volume path to the SOME/IP signal definitions CSV.
      If empty, blf_silver_someip_signals will be empty.
      Format: service_id,method_id,signal_name,start_bit,bit_length,byte_order,is_signed,scale,offset
    default: /Volumes/${var.target_catalog}/${var.target_schema}/signals/someip_signals.csv

  enum_signals_path:
    description: >
      Unity Catalog Volume path to the enum value mapping CSV (optional).
      Maps raw integer signal values to human-readable category strings.
      Format: signal_name,raw_value,category
      When set, decoded CAN and SOME/IP signals carry a signal_str column with the category name.
    default: ""

  signals_table:
    description: >
      Unity Catalog table (catalog.schema.table) with CAN signal definitions (optional).
      Same columns as the signals_path CSV. Takes precedence over signals_path when set.
      Set via: databricks bundle deploy --var="signals_table=main.blf_dev.can_signals"
    default: ""

  someip_signals_table:
    description: >
      Unity Catalog table (catalog.schema.table) with SOME/IP signal definitions (optional).
      Same columns as the someip_signals_path CSV. Takes precedence over someip_signals_path when set.
      Set via: databricks bundle deploy --var="someip_signals_table=main.blf_dev.someip_signals"
    default: ""

  enum_signals_table:
    description: >
      Unity Catalog table (catalog.schema.table) with enum value mappings (optional).
      Same columns as the enum_signals_path CSV. Takes precedence over enum_signals_path when set.
      Set via: databricks bundle deploy --var="enum_signals_table=main.blf_dev.enum_values"
    default: ""

  warehouse_id:
    description: >
      SQL warehouse ID for the BLF signal viewer app.
      Find it in the Databricks workspace under SQL Warehouses -> Connection details -> HTTP path
      (extract the id after /warehouses/).
      Set via: databricks bundle deploy --var="warehouse_id=<id>"
    default: ""

  genie_space_id:
    description: >
      Databricks Genie Space ID for natural-language signal exploration.
      Find it in the Databricks workspace URL when viewing the Genie Space:
      /genie/spaces/<id>
      Set via: databricks bundle deploy --var="genie_space_id=<id>"
    default: ""

  signal_docs_path:
    description: >
      Unity Catalog Volume directory containing signal documentation files
      (PDF, DOCX, PPTX, or XLSX). Auto Loader monitors this directory; each
      extracted section (PDF page / DOCX document / PPTX slide / XLSX
      sheet) becomes a row in blf_signal_doc_sections for Genie Space to
      search when grounding natural-language questions about signal
      meaning.
    default: /Volumes/${var.target_catalog}/${var.target_schema}/docs

  semantic_model_endpoint:
    description: >
      Name of a Databricks Model Serving endpoint (foundation/multimodal
      model) used to derive a semantic_summary column on
      blf_signal_doc_sections via the ai_query() SQL function, from the
      already-extracted section text. Optional -- if empty, semantic_summary
      is left NULL and no model calls are made. The pipeline's run-as
      identity needs CAN_QUERY permission on this endpoint.
      Set via: databricks bundle deploy --var="semantic_model_endpoint=databricks-claude-3-7-sonnet"
    default: ""

  scene_window_seconds:
    description: >
      Base tumbling-window length, in seconds, for the blf_scenes pipeline.
      Scene boundaries are this fixed grid merged with detected signal change
      points. Larger values give fewer, coarser scenes.
    default: "10.0"

  scene_min_segment_seconds:
    description: >
      Minimum scene length in seconds. A candidate boundary closer than this to
      the previous kept boundary is dropped, which is what stops a noisy signal
      from shattering a log into thousands of scenes. Must not exceed
      scene_window_seconds; the pipeline clamps it if it does.
    default: "2.0"

  scene_changepoint_signals:
    description: >
      Comma-separated signal names watched for change points. Empty means every
      signal in scope, which is not recommended -- high-rate signals produce a
      boundary almost everywhere. Names must match blf_gold_signals.signal_name
      exactly.
    default: VehicleSpeed_kmh,BrakePressure_bar,AccelPedal_pct,SteeringAngle_deg,ignition_status,AcRequest,FanSpeed_pct

  scene_k:
    description: >
      Number of behaviour clusters for the blf_scenes pipeline. Set to 0 to pick
      k automatically by silhouette score -- but note that an automatic sweep can
      change the cluster count, and therefore every cluster id, between runs.
    default: "8"

  scene_baseline_scope:
    description: >
      Population that anomaly z-scores are measured against: "global" (default)
      compares every scene to the whole corpus, "file" compares it only to its
      own source file. Global is right for "find the unusual scene across my
      logs"; file only makes sense for a catalog mixing very different vehicles.
    default: global

  scene_anomaly_weights:
    description: >
      Comma-separated weights for the anomaly score terms, in the order
      distance-from-centroid, robust z magnitude, cluster rarity. Normalized to
      sum to 1.
    default: 0.45,0.40,0.15

  scene_rules_path:
    description: >
      Unity Catalog Volume path to the scene action-labeling rules CSV.
      If empty and scene_rules_table is unset, every scene falls back to the
      default label.
      Format: rule_id,condition_index,label,priority,signal_source,channel,
      signal_name,feature,op,value_a,value_b,negate,description
    default: /Volumes/${var.target_catalog}/${var.target_schema}/signals/scene_rules.csv

  scene_rules_table:
    description: >
      Unity Catalog table (catalog.schema.table) with scene labeling rules
      (optional). Same columns as the scene_rules_path CSV. Takes precedence
      over scene_rules_path when set.
      Set via: databricks bundle deploy --var="scene_rules_table=main.blf_dev.scene_rules"
    default: ""

  scene_summary_min_score:
    description: >
      Minimum anomaly_score (0-100) a scene needs before blf_scenes spends an
      ai_query call summarizing it. blf_scenes is a materialized view, so every
      refresh re-runs every call it makes -- lower this with care.
      Only has an effect when semantic_model_endpoint is set.
    default: "60"

  excel_source_path:
    description: >
      UC Volume path to the Excel signal definition file.
      Used by the signal_importer job.
      Example: /Volumes/main/blf_dev/signals/signals.xlsx
    default: ""

  excel_sheet:
    description: "Sheet name or 0-based index in the Excel file (default: 0)."
    default: "0"

  excel_header_row:
    description: "0-based row index that contains column headers (default: 0)."
    default: "0"

  signal_import_mode:
    description: '"can" or "someip" (default: can).'
    default: "can"

  signal_column_map_json:
    description: >
      JSON encoding of the COLUMN_MAP dict mapping signal fields to Excel
      column headers or 0-based indices.
      Example: '{"message_id":"CAN ID","signal_name":"Signal Name","start_byte":5}'
    default: "{}"

  excel_secret_scope:
    description: Databricks secret scope that holds the Excel file password.
    default: "blf"

  excel_secret_key:
    description: Key within the secret scope for the Excel file password.
    default: "excel_password"

  mapbox_secret_scope:
    description: >
      Databricks secret scope that holds the Mapbox access token used by the
      Signal Viewer's GPS map. Only read once the mapbox-token resource is
      uncommented in signal_viewer.app.yml; the scope must already exist by
      then or the app deploy fails. Left commented out, the map uses the
      tokenless carto style.
    default: "blf"

  mapbox_secret_key:
    description: Key within the secret scope for the Mapbox access token.
    default: "mapbox_token"

# ── deployment targets ────────────────────────────────────────────────────────

targets:
  # ── dev ──────────────────────────────────────────────────────────────────
  # Default target.  Pipeline runs in development mode (no auto-restart,
  # cheaper cluster, DAB prefixes the name with your username automatically).
  dev:
    mode: development
    default: true
    variables:
      target_schema: blf_dev

  # ── prod ─────────────────────────────────────────────────────────────────
  # Continuous pipeline: restarts automatically, runs in production mode.
  prod:
    mode: production
    resources:
      pipelines:
        blf_ingestion:
          continuous:  true
          development: false
        signal_docs:
          development: false
        # Triggered, like signal_docs: clustering and the anomaly baseline are
        # whole-corpus computations, so this must not inherit continuous: true.
        blf_scenes:
          development: false
    variables:
      target_schema: blf
