resources:
  pipelines:
    signal_docs:
      name: vector-blf-signal-docs-${bundle.target}

      # Unity Catalog output location (same catalog/schema as blf_ingestion)
      catalog: ${var.target_catalog}
      target: ${var.target_schema}

      # Pipeline parameters -- consumed by spark.conf.get() in the Python file
      configuration:
        blf.signal_docs_path:        ${var.signal_docs_path}
        blf.semantic_model_endpoint: ${var.semantic_model_endpoint}

      libraries:
        - file:
            path: ./signal_docs_pipeline.py

      environment:
        dependencies:
          - pypdf>=4.0,<6.0
          - python-docx>=1.1.0,<2.0
          - python-pptx>=0.6.23,<1.1
          - openpyxl>=3.1.5,<4.0

      serverless: true

      channel: CURRENT    # use the latest DLT runtime
      edition: ADVANCED   # required for Auto Loader

      # Documentation uploads are infrequent -- triggered, not continuous.
      # Run manually (databricks bundle run signal_docs) or on a schedule
      # after uploading new files, unlike blf_ingestion's streaming intake.
      continuous:  false
      development: true
