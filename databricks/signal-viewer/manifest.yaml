version: 1
name: "Signal Viewer"
description: "Interactive signal visualization dashboard for BLF/MF4 data stored in Unity Catalog."
icon: icon.svg

resource_specs:
  - name: "sql-warehouse"
    description: "The SQL warehouse the app uses to query signal data."
    sql_warehouse_spec:
      permission: "CAN_USE"
  - name: "video-volume"
    description: "The Unity Catalog volume the app reads dashcam-style video files from."
    uc_securable_spec:
      securable_type: "VOLUME"
      permission: "READ_VOLUME"

user_api_scopes:
  - "sql"
  - "genie"
  - "files.files"
