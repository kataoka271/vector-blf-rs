resources:
  apps:
    signal_viewer:
      name: signal-viewer
      # source_code_path is relative to this file; "." resolves to databricks/signal-viewer/
      source_code_path: .
      description: Interactive signal visualization dashboard for BLF/MF4 data.
      user_api_scopes:
        - sql
        - genie
        - files.files
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: "vehicle network signal analysis"
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        # Mapbox is opt-in. Without this resource the GPS map uses the tokenless
        # carto style (see app/figures.py), which needs no credentials at all.
        # To enable real Mapbox styles, create the secret first -- deploy fails
        # if the scope does not exist, and an empty key is NOT sufficient:
        #   databricks secrets create-scope blf
        #   databricks secrets put-secret blf mapbox_token --string-value <token>
        # then uncomment this block AND the matching MAPBOX_TOKEN env entry in
        # app.yaml (an env `valueFrom` naming an undeclared resource also fails).
        # - name: mapbox-token
        #   secret:
        #     scope: ${var.mapbox_secret_scope}
        #     key: ${var.mapbox_secret_key}
        #     permission: READ
        - name: video-volume
          # READ_VOLUME here is auto-granted to the app SP on deploy (unlike the
          # table access below). The volume itself is NOT created by this bundle --
          # create `main.<schema>.video` manually first, same as `raw`/`signals`.
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.target_catalog}.${var.target_schema}.video
            permission: READ_VOLUME
        # WRITE_VOLUME grants for the /upload screen (app/upload.py). Declared as
        # separate resources from the READ_VOLUME grant above -- and from each other --
        # since `permission` here is a single value per resource, not a list.
        - name: video-volume-write
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.target_catalog}.${var.target_schema}.video
            permission: WRITE_VOLUME
        - name: raw-volume-write
          # `raw` is the same Auto Loader source volume as blf_source_path in
          # databricks.yml; also NOT created by this bundle, create it manually first.
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.target_catalog}.${var.target_schema}.raw
            permission: WRITE_VOLUME
      # NOTE: DABs grants SQL warehouse CAN_USE automatically, but Unity Catalog
      # table access must be granted separately to the app service principal.
      # After first deploy, find the SP's application_id via:
      #   databricks apps get signal-viewer
      # Then run:
      #   databricks experimental aitools tools query \
      #     "GRANT USE CATALOG ON CATALOG main TO \`<sp_application_id>\`"
      #   databricks experimental aitools tools query \
      #     "GRANT USE SCHEMA ON SCHEMA main.<schema> TO \`<sp_application_id>\`"
      #   databricks experimental aitools tools query \
      #     "GRANT SELECT ON SCHEMA main.<schema> TO \`<sp_application_id>\`"
      #
      # Granted (2026-06-10): main.blf_dev -- 12bf96f4-642b-46e7-a09b-1fd2082e907e
