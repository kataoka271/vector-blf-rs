# Two containers that only talk to each other through a real Lakebase table and a real
# Zerobus stream (see topologies/docker_bridge.py) -- no loopback bus, no shared
# process. Needs a working Lakebase endpoint and Zerobus workspace; nothing is mocked.
#
# Run from the repo root:
#   RUN_ID=$(python -c "import uuid; print(uuid.uuid4())") \
#     docker compose -f examples/bench/docker-compose.yml up --build
#
# Credentials come from the environment (export them, or put them in
# examples/bench/.env) -- see transport/connection.py::ConnectionConfig for the full
# field list. DATABRICKS_HOST/DATABRICKS_TOKEN (a PAT) authenticate
# LAKEBASE_ENDPOINT when no profile is set; to authenticate via a named profile
# instead (LAKEBASE_PROFILE/ZEROBUS_PROFILE), uncomment the ~/.databrickscfg
# mount below on both services -- but only a service-principal (OAuth M2M) profile
# works this way. A personal OAuth U2M profile's "databricks-cli" auth type shells out
# to the databricks CLI binary and its browser token cache, neither of which exists in
# this image, so LAKEBASE_ENDPOINT needs a PAT (DATABRICKS_HOST/TOKEN) unless
# LAKEBASE_PROFILE names a service principal too. LAKEBASE_DATABASE and
# ZEROBUS_CATALOG/ZEROBUS_SCHEMA/ZEROBUS_SERVICE_PRINCIPAL_ID have no library-level
# default (see transport/connection.py::ConnectionConfig) and must be set here. The
# producer builds only a Lakebase bus, so ZEROBUS_* is genuinely unused there and only
# the consumer fails (with MissingSetting, naming them) when they are unset.
#
# RUN_ID has no default on purpose: LakebaseRx replays a run_id's entire history on
# every fresh consumer start (see transport/lakebase.py's catch-up query), so reusing
# one across demo runs floods the consumer with old frames -- pick a fresh id each time.

services:
  producer:
    build:
      context: ../..
      dockerfile: examples/bench/Dockerfile
    command:
      - --topology
      - docker-producer
      - --run-id
      - ${RUN_ID:?set RUN_ID so both containers share one run, e.g. RUN_ID=$(uuidgen)}
      - --duration
      - ${DURATION:-60}
    environment:
      - LAKEBASE_ENDPOINT
      - LAKEBASE_PROFILE
      - LAKEBASE_DATABASE
      - DOCKER_BUS_TABLE
      - DATABRICKS_HOST
      - DATABRICKS_TOKEN
    # volumes:
    #   - ~/.databrickscfg:/root/.databrickscfg:ro

  consumer:
    build:
      context: ../..
      dockerfile: examples/bench/Dockerfile
    command:
      - --topology
      - docker-consumer
      - --run-id
      - ${RUN_ID:?set RUN_ID so both containers share one run, e.g. RUN_ID=$(uuidgen)}
      - --duration
      - ${DURATION:-60}
    environment:
      - LAKEBASE_ENDPOINT
      - LAKEBASE_PROFILE
      - LAKEBASE_DATABASE
      - DOCKER_BUS_TABLE
      - ZEROBUS_WORKSPACE_ID
      - ZEROBUS_REGION
      - ZEROBUS_PROFILE
      - ZEROBUS_CATALOG
      - ZEROBUS_SCHEMA
      - ZEROBUS_SERVICE_PRINCIPAL_ID
      - ZEROBUS_TABLE
      - DATABRICKS_HOST
      - DATABRICKS_TOKEN
      - DATABRICKS_CLIENT_ID
      - DATABRICKS_CLIENT_SECRET
    # volumes:
    #   - ~/.databrickscfg:/root/.databrickscfg:ro
