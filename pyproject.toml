[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "vector-blf"
version = "0.1.0"
description = "Python bindings for vector-blf-rs: read Vector BLF automotive log files"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "vector_blf"

[dependency-groups]
dev = [
    "autosar-data>=0.10.1",
    "maturin>=1.13.3",
    "python-can>=4.5.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 120
