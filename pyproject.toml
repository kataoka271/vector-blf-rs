[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "vector-blf"
version = "0.1.0"
description = "Python bindings for vector-blf-rs: read Vector BLF automotive log files"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "vector_blf"

[dependency-groups]
databricks = [
    "dash>=4.2.0",
    "dash-ag-grid>=35.2.0",
    "dash-bootstrap-components>=1.6.0",
    "databricks-sdk>=0.102.0",
    "databricks-sql-connector>=4.2.6",
    "pandas>=2.0.3",
    "plotly>=6.8.0",
    "python-dotenv>=1.0.1",
]
dev = [
    "autosar-data>=0.10.1",
    "maturin>=1.13.3",
    "openpyxl>=3.1.5",
    "pandas>=2.0",
    "pytest>=8.0",
    "python-can>=4.5.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.ruff]
line-length = 120

[tool.pyright]
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["databricks"]
