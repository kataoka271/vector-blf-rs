[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "vector-blf"
version = "0.1.0"
description = "Python bindings for vector-blf-rs: read Vector BLF automotive log files"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "vector_blf"

[dependency-groups]
databricks = [
    "dash>=2.17.0,<3.0.0",
    "dash-ag-grid>=31.0.0",
    "dash-bootstrap-components>=1.5.0",
    "databricks-sdk>=0.117.0",
    "databricks-sql-connector>=4.2.6",
    "pandas>=2.0.0,<3.0.0",
    "plotly>=5.20.0,<6.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.15.3",
]
dev = [
    "autosar-data>=0.10.1",
    "maturin>=1.13.3",
    "msoffcrypto-tool>=5.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0",
    "pandera>=0.19.0",
    "playwright>=1.48.0",
    "pypdf>=4.0,<6.0",
    "pytest>=8.0",
    "python-can>=4.5.0",
    "python-docx>=1.1.0,<2.0",
    "python-pptx>=0.6.23,<1.1",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
testing = [
    "databricks-sdk>=0.117.0",
    "databricks-sql-connector>=4.2.6",
    "databricks-zerobus-ingest-sdk>=1.4.0",
    "grpcio-tools>=1.60.0",
    "pandas>=2.0.0,<3.0.0",
    "protobuf>=4.25.0,<7.0",
    "psycopg[binary]>=3.1.0,<4.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0",
    "python-can>=4.5.0",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 120

[tool.pyright]
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["databricks", "scripts", "examples/bench"]

[tool.ty.environment]
root = ["./src", "./databricks", "./scripts", "./examples/bench"]
